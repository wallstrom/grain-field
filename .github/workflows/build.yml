# Builds the Mac plugins in the cloud when you push to GitHub.
# Download them from the run's "Artifacts" section.
name: Build

on:
  push:
  workflow_dispatch:

# The build only needs to read the code. Without this, each run's token could also write to the repository.
permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Package
        run: |
          mkdir -p dist
          cp -R "build/GrainField_artefacts/Release/AU/Grain Field.component" dist/
          cp -R "build/GrainField_artefacts/Release/VST3/Grain Field.vst3" dist/
          cp -R "build/GrainField_artefacts/Release/Standalone/Grain Field.app" dist/
          cp LICENSE dist/
          mkdir -p dist/Notices/Fonts
          cp Resources/Fonts/Silkscreen-OFL.txt Resources/Fonts/VT323-OFL.txt dist/Notices/Fonts/
          cp Resources/Sounds/CREDITS.txt dist/Notices/Sound-Credits.txt
          cd dist && zip -qry "../Grain Field macOS.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: Grain Field macOS
          path: Grain Field macOS.zip
